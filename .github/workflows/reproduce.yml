name: Reproduce network measures
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install R and igraph
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-igraph
      - name: Run full pipeline
        run: Rscript run_all.R
      - name: Check headline numbers
        run: |
          Rscript -e 'e <- read.csv("output/edge_list.csv"); stopifnot(nrow(e) == 16529); cat("edges OK:", nrow(e), "\n")'
