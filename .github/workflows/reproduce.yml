name: Reproduce network measures
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("igraph","dplyr","tidyr","ggplot2"))'
      - name: Run full pipeline
        run: Rscript run_all.R
      - name: Check headline numbers
        run: |
          Rscript -e 'e <- read.csv("output/edge_list.csv"); stopifnot(nrow(e) == 16529); cat("edges OK:", nrow(e), "\n")'
